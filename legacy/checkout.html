<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Deshojo Bazar</title><link rel="stylesheet" href="assets/styles.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs">Home / Checkout</div><h1>Checkout</h1></div></section><section class="section"><div class="container checkout-layout"><form class="checkout-card" onsubmit="placeOrder(event)"><h2>Delivery information</h2><div class="form-grid"><div class="field"><label>নাম</label><input required placeholder="আপনার নাম"></div><div class="field"><label>মোবাইল</label><input required placeholder="01XXXXXXXXX"></div><div class="field full"><label>ঠিকানা</label><textarea required rows="3" placeholder="বাড়ি, রাস্তা, এলাকা"></textarea></div><div class="field"><label>শহর</label><input required value="Dhaka"></div><div class="field"><label>Payment</label><select><option>Cash on Delivery</option><option disabled>bKash integration required</option><option disabled>Card gateway integration required</option></select></div></div><div class="notice">এটি একটি কার্যকর front-end checkout prototype। লাইভ অর্ডার, bKash/Nagad/card payment, stock deduction ও admin order management চালু করতে Deshojo Bazar-এর বর্তমান backend/API-এর সাথে সংযোগ করতে হবে।</div><button class="btn btn-primary" style="width:100%;margin-top:18px">Place Demo Order</button></form><aside class="checkout-card"><h2>Your order</h2><div id="orderSummary"></div></aside></div></section></main><div data-footer></div><script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
